<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Internal Ads Dashboard — 129</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bone:#EDEDE7; --ink:#16181A; --graphite:#6B6F73; --rule:#D3D3CB;
    --ultramarine:#2B3BE8; --rust:#A32C1F; --surface:#F6F6F2;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bone); color:var(--ink);
    font-family:Archivo,-apple-system,system-ui,sans-serif; font-size:15px; line-height:1.45;
    -webkit-font-smoothing:antialiased}
  .mono{font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums}
  .wrap{max-width:1240px; margin:0 auto; padding:0 20px}

  header{border-bottom:1px solid var(--rule); background:var(--bone); position:sticky; top:0; z-index:20}
  .head{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; padding:22px 0 14px}
  h1{font-size:22px; font-weight:700; letter-spacing:-.02em; margin:0}
  .stamp{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--graphite)}
  .controls{display:flex; gap:20px; flex-wrap:wrap; padding-bottom:16px}
  .group{display:flex; border:1px solid var(--rule); background:var(--surface)}
  .group button{font:inherit; font-size:13px; padding:6px 12px; border:0; background:none;
    color:var(--graphite); cursor:pointer; border-right:1px solid var(--rule)}
  .group button:last-child{border-right:0}
  .group button[aria-pressed="true"]{background:var(--ink); color:var(--bone)}
  .group button:focus-visible{outline:2px solid var(--ultramarine); outline-offset:-2px}

  .band{padding:10px 0; font-size:13px; color:var(--rust); border-bottom:1px solid var(--rule)}
  .totals{display:flex; gap:40px; flex-wrap:wrap; padding:22px 0; border-bottom:1px solid var(--rule)}
  .total .k{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--graphite)}
  .total .v{font-size:34px; font-weight:400; letter-spacing:-.02em; line-height:1.15}

  table{width:100%; border-collapse:collapse}
  th{font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--graphite);
    font-weight:500; text-align:right; padding:16px 10px 8px; border-bottom:1px solid var(--rule)}
  th:first-child,td:first-child{text-align:left; padding-left:0}
  td{padding:11px 10px; border-bottom:1px solid var(--rule); text-align:right; font-size:14px}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:var(--surface)}
  tbody tr:focus-visible{outline:2px solid var(--ultramarine); outline-offset:-2px}
  .name{font-weight:500; letter-spacing:-.01em}
  .sub{font-size:11px; color:var(--graphite); letter-spacing:.05em; text-transform:uppercase}

  .spend{position:relative}
  .spend .bar{position:absolute; right:10px; top:50%; transform:translateY(-50%);
    height:22px; background:var(--ultramarine); opacity:.13}
  .spend .fig{position:relative}

  .chip{display:inline-block; font-size:10px; letter-spacing:.08em; text-transform:uppercase;
    border:1px solid var(--rust); color:var(--rust); padding:1px 5px; margin-left:6px}
  .delta.up{color:var(--rust)} .delta.down{color:var(--ultramarine)}
  .off td{color:var(--graphite)}
  .fold{padding:18px 0; font-size:13px}
  .fold button{font:inherit; background:none; border:0; color:var(--ultramarine);
    cursor:pointer; text-decoration:underline; padding:0}
  .empty{padding:56px 0; color:var(--graphite)}

  .scrim{position:fixed; inset:0; background:rgba(22,24,26,.35); opacity:0; pointer-events:none;
    transition:opacity .18s; z-index:25}
  .scrim.on{opacity:1; pointer-events:auto}
  .drawer{position:fixed; top:0; right:0; height:100%; width:min(680px,100%); background:var(--bone);
    border-left:1px solid var(--rule); z-index:30; transform:translateX(101%);
    transition:transform .22s ease; overflow-y:auto}
  .drawer.on{transform:none}
  .drawer .pad{padding:24px}
  .drawer h2{font-size:20px; margin:0 0 2px; letter-spacing:-.02em; padding-right:70px}
  .close{position:absolute; top:18px; right:20px; background:none; border:0; font:inherit;
    cursor:pointer; color:var(--graphite)}
  .kv{display:grid; grid-template-columns:repeat(auto-fit,minmax(104px,1fr)); gap:16px;
    margin:22px 0; padding:16px 0; border-top:1px solid var(--rule); border-bottom:1px solid var(--rule)}
  .kv .k{font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--graphite)}
  .kv .v{font-size:19px}
  .lbl{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--graphite);
    margin:0 0 10px; font-weight:500}
  .creas{display:grid; gap:10px}
  .crea{display:flex; gap:12px; border:1px solid var(--rule); background:var(--surface); padding:10px}
  .crea img{width:64px; height:64px; object-fit:cover; background:var(--rule); flex:none}
  .crea .meta{flex:1; min-width:0}
  .crea .t{font-size:13px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .crea a{color:var(--ultramarine); font-size:12px}
  .send{margin:26px 0 40px; padding-top:20px; border-top:1px solid var(--rule)}
  .btn{font:inherit; font-size:14px; padding:9px 16px; border:1px solid var(--ink);
    background:var(--ink); color:var(--bone); cursor:pointer}
  .btn:disabled{opacity:.45; cursor:default}
  input[type=text]{font:inherit; font-size:14px; padding:8px 10px; border:1px solid var(--rule);
    background:var(--surface); width:100%; margin-bottom:10px}
  .link-out{margin-top:12px; font-size:12px; word-break:break-all; background:var(--surface);
    border:1px solid var(--rule); padding:10px}

  @media (max-width:760px){
    thead{display:none}
    tbody tr{display:grid; grid-template-columns:1fr auto; gap:2px 12px; padding:12px 0}
    td{border:0; padding:2px 0; text-align:right}
    td:first-child{grid-column:1/3; text-align:left}
    .spend .bar{right:0}
    .kv{grid-template-columns:repeat(2,1fr)}
  }
  @media (prefers-reduced-motion:reduce){ *{transition:none !important} }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="head">
      <h1>Internal Ads Dashboard</h1>
      <span class="stamp" id="stamp"></span>
      <a href="/internal-tools" style="margin-left:auto;font-size:13px;color:var(--ultramarine)">Internal Tools</a>
    </div>
    <div class="controls">
      <div class="group" id="src" role="group" aria-label="Source"></div>
      <div class="group" id="per" role="group" aria-label="Période">
        <button data-p="last_7d">7 j</button>
        <button data-p="last_30d" aria-pressed="true">30 j</button>
        <button data-p="last_90d">90 j</button>
        <button data-p="maximum">Max</button>
      </div>
    </div>
  </div>
</header>

<div id="band"></div>

<main class="wrap">
  <div class="totals" id="totals"></div>
  <table>
    <thead><tr>
      <th>Campagne</th><th>Dépense</th><th>CPM</th><th>CTR</th>
      <th>Résultats</th><th>Coût / résultat</th><th>Fréquence</th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="fold" id="fold"></div>
  <div class="empty" id="empty" hidden>Aucune campagne n’a diffusé sur cette période.</div>
</main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <button class="close" id="closeDrawer">Fermer</button>
  <div class="pad" id="drawerBody"></div>
</aside>

<script>
const S = { key: localStorage.getItem('adminKey') || '', source:'all', preset:'last_30d',
            data:null, sources:{}, showOff:false };

function askKey(){
  const k = prompt('Clé d’accès 129');
  if (k) { S.key = k.trim(); localStorage.setItem('adminKey', S.key); }
  return S.key;
}

async function api(path){
  if (!S.key && !askKey()) throw new Error('Clé requise.');
  const r = await fetch(path, { headers:{ Authorization:'Bearer ' + S.key } });
  if (r.status === 403){ localStorage.removeItem('adminKey'); S.key=''; throw new Error('Clé refusée. Recharge la page pour la ressaisir.'); }
  const d = await r.json().catch(()=>({}));
  if (!r.ok) throw new Error(d.error || 'Erreur de chargement.');
  return d;
}

const nf = (n,d=0)=> Number(n||0).toLocaleString('fr-FR',{minimumFractionDigits:d,maximumFractionDigits:d});
const money = (n,c)=> nf(n, Math.abs(n)<100 ? 2 : 0) + ' ' + (c==='USD' ? '$' : '€');
const pct = n => nf(n,2) + ' %';
const esc = s => String(s??'').replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

function renderSources(){
  const el = document.getElementById('src');
  const keys = ['all', ...Object.keys(S.sources)];
  el.innerHTML = '';
  keys.forEach(k => {
    const b = document.createElement('button');
    const cfg = S.sources[k];
    b.textContent = k === 'all' ? 'Toutes' : cfg.label;
    if (cfg && !cfg.configured) { b.disabled = true; b.title = 'Compte publicitaire non renseigné'; }
    b.setAttribute('aria-pressed', String(k === S.source));
    b.onclick = () => { S.source = k; renderSources(); load(); };
    el.appendChild(b);
  });
}

function renderBand(problems){
  const el = document.getElementById('band');
  el.innerHTML = (problems && problems.length)
    ? '<div class="wrap band">' + problems.map(p =>
        `<div><strong>${esc(p.label || p.source)}</strong> — ${esc(p.message)}</div>`).join('') + '</div>'
    : '';
}

function renderTotals(totals){
  document.getElementById('totals').innerHTML = totals.map(t => `
    <div class="total"><div class="k">Dépense ${t.currency}</div>
      <div class="v mono">${money(t.spend,t.currency)}</div></div>
    <div class="total"><div class="k">Résultats ${t.currency}</div>
      <div class="v mono">${nf(t.results)}</div></div>
    <div class="total"><div class="k">Campagnes ${t.currency}</div>
      <div class="v mono">${nf(t.campaigns)}</div></div>`).join('');
}

function row(c, max){
  const live = /ACTIVE/.test(c.status);
  const w = max > 0 ? Math.max(2, (c.spend / max) * 132) : 0;
  const flags = c.flags.map(f => `<span class="chip">${f === 'cpr_up' ? 'coût ↑' : 'fréquence'}</span>`).join('');
  const delta = c.cpr_delta === null ? ''
    : `<div class="sub delta ${c.cpr_delta > 0 ? 'up' : 'down'}">${c.cpr_delta > 0 ? '+' : ''}${nf(c.cpr_delta*100,0)} %</div>`;
  return `<tr tabindex="0" data-id="${c.id}" data-source="${c.source}" class="${live ? '' : 'off'}">
    <td><div class="name">${esc(c.name)}${flags}</div>
        <div class="sub">${esc(c.source_label)} · ${live ? 'active' : esc(c.status.toLowerCase())}</div></td>
    <td class="spend"><span class="bar" style="width:${w}px"></span><span class="fig mono">${money(c.spend,c.currency)}</span></td>
    <td class="mono">${money(c.cpm,c.currency)}</td>
    <td class="mono">${pct(c.ctr)}</td>
    <td class="mono">${nf(c.result_count)}<div class="sub">${esc(c.result_type || '—')}</div></td>
    <td class="mono">${c.cost_per_result == null ? '—' : money(c.cost_per_result,c.currency)}${delta}</td>
    <td class="mono">${nf(c.frequency,2)}</td>
  </tr>`;
}

function renderRows(){
  const cs = S.data.campaigns;
  const live = cs.filter(c => /ACTIVE/.test(c.status));
  const off  = cs.filter(c => !/ACTIVE/.test(c.status));
  const max  = live.length ? Math.max(...live.map(c => c.spend)) : 0;
  const shown = S.showOff ? live.concat(off) : live;

  document.getElementById('rows').innerHTML = shown.map(c => row(c, max)).join('');
  document.getElementById('empty').hidden = shown.length > 0;
  document.getElementById('fold').innerHTML = off.length
    ? `<button id="toggleFold">${S.showOff ? 'Masquer' : 'Afficher'} ${off.length} campagne${off.length>1?'s':''} hors ligne</button>`
    : '';
  const t = document.getElementById('toggleFold');
  if (t) t.onclick = () => { S.showOff = !S.showOff; renderRows(); };

  document.querySelectorAll('#rows tr').forEach(tr => {
    const open = () => openDrawer(tr.dataset.source, tr.dataset.id);
    tr.onclick = open;
    tr.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } };
  });
}

async function load(){
  try{
    const d = await api(`/api/campaigns?source=${S.source}&preset=${S.preset}`);
    S.data = d;
    document.getElementById('stamp').textContent =
      d.window ? `${d.window.since} → ${d.window.until}` : 'Historique complet';
    renderBand(d.problems); renderTotals(d.totals); renderRows();
  }catch(e){
    document.getElementById('band').innerHTML =
      `<div class="wrap band"><strong>Chargement impossible</strong> — ${esc(e.message)}</div>`;
  }
}

async function openDrawer(source, id){
  const dr = document.getElementById('drawer'), sc = document.getElementById('scrim');
  dr.classList.add('on'); sc.classList.add('on'); dr.setAttribute('aria-hidden','false');
  const body = document.getElementById('drawerBody');
  body.innerHTML = '<p class="sub">Chargement…</p>';
  try{
    const d = await api(`/api/campaign?source=${source}&id=${id}&preset=${S.preset}`);
    const c = d.campaign, cur = d.currency;
    const res = d.daily.reduce((a,r) => a + r.result_count, 0);
    body.innerHTML = `
      <h2>${esc(c.name)}</h2>
      <div class="sub">${esc(d.source_label)} · ${esc(c.objective || '')} · ${esc(c.status.toLowerCase())}</div>
      <div class="kv">
        <div><div class="k">Dépense</div><div class="v mono">${money(d.totals.spend,cur)}</div></div>
        <div><div class="k">Impressions</div><div class="v mono">${nf(d.totals.impressions)}</div></div>
        <div><div class="k">Résultats</div><div class="v mono">${nf(res)}</div></div>
        <div><div class="k">Coût / résultat</div><div class="v mono">${res ? money(d.totals.spend/res,cur) : '—'}</div></div>
      </div>
      <p class="lbl">Créas</p>
      <div class="creas">${d.ads.length ? d.ads.map(a => `
        <div class="crea">
          <img src="${a.thumbnail || ''}" alt="">
          <div class="meta">
            <div class="t">${esc(a.name)}</div>
            <div class="sub mono">${money(a.spend,cur)} · ${nf(a.result_count)} · ${a.cost_per_result == null ? '—' : money(a.cost_per_result,cur)} / rés.</div>
            ${a.preview ? `<a href="${a.preview}" target="_blank" rel="noopener">Voir la créa</a>` : ''}
          </div>
        </div>`).join('') : '<p class="sub">Aucune créa n’a diffusé sur cette période.</p>'}
      </div>
      <div class="send">
        <p class="lbl">Envoyer au client</p>
        <input type="text" id="rTitle" placeholder="Titre vu par le client" value="${esc(c.name)}">
        <button class="btn" id="mkLink">Créer le lien client</button>
        <div id="linkOut"></div>
      </div>`;
    document.getElementById('mkLink').onclick = async ev => {
      const b = ev.target; b.disabled = true; b.textContent = 'Création…';
      const out = document.getElementById('linkOut');
      try{
        const t = document.getElementById('rTitle').value;
        const r = await api(`/api/sign?source=${source}&c=${id}&t=${encodeURIComponent(t)}`);
        out.innerHTML = `<div class="link-out mono">${esc(r.url)}</div>
                         <button class="btn" style="margin-top:10px" id="cp">Copier le lien</button>`;
        document.getElementById('cp').onclick = () => {
          navigator.clipboard.writeText(r.url);
          document.getElementById('cp').textContent = 'Lien copié';
        };
      }catch(e){ out.innerHTML = `<div class="link-out">${esc(e.message)}</div>`; }
      b.disabled = false; b.textContent = 'Créer le lien client';
    };
  }catch(e){
    body.innerHTML = `<p class="band">${esc(e.message)}</p>`;
  }
}

function closeDrawer(){
  document.getElementById('drawer').classList.remove('on');
  document.getElementById('drawer').setAttribute('aria-hidden','true');
  document.getElementById('scrim').classList.remove('on');
}
document.getElementById('closeDrawer').onclick = closeDrawer;
document.getElementById('scrim').onclick = closeDrawer;
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });

document.querySelectorAll('#per button').forEach(b => b.onclick = () => {
  S.preset = b.dataset.p;
  document.querySelectorAll('#per button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  load();
});

(async function init(){
  try{ S.sources = (await api('/api/sources')).sources; renderSources(); }
  catch(e){ /* le bandeau de load() porte le message */ }
  load();
})();
</script>
</body>
</html>
