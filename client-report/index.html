<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Rapport de campagne — 129</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root{--bone:#EDEDE7;--ink:#16181A;--graphite:#6B6F73;--rule:#D3D3CB;--ultramarine:#2B3BE8;--surface:#F6F6F2}
  *{box-sizing:border-box} html,body{margin:0}
  body{background:var(--bone);color:var(--ink);font-family:Archivo,system-ui,sans-serif;font-size:15px;line-height:1.5}
  .mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
  .wrap{max-width:820px;margin:0 auto;padding:0 20px 80px}
  header{border-bottom:1px solid var(--rule);margin-bottom:8px}
  .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--graphite);padding-top:36px}
  h1{font-size:30px;letter-spacing:-.02em;margin:6px 0 10px}
  .period{font-size:13px;color:var(--graphite);padding-bottom:26px}
  h2{font-size:19px;letter-spacing:-.02em;margin:44px 0 0}
  .lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--graphite);margin:32px 0 12px;font-weight:500}
  .kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:20px;
      padding:20px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);margin-top:14px}
  .kv .k{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--graphite)}
  .kv .v{font-size:26px;letter-spacing:-.02em}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--graphite);font-weight:500;
     text-align:right;padding:8px 8px;border-bottom:1px solid var(--rule)}
  th:first-child,td:first-child{text-align:left;padding-left:0}
  td{padding:9px 8px;border-bottom:1px solid var(--rule);text-align:right}
  .creas{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .crea{border:1px solid var(--rule);background:var(--surface);padding:10px}
  .crea img{width:100%;aspect-ratio:1;object-fit:cover;background:var(--rule);display:block;margin-bottom:8px}
  .crea .t{font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .crea .n{font-size:12px;color:var(--graphite)}
  .crea a{font-size:11px;color:var(--ultramarine)}
  footer{margin-top:64px;padding-top:18px;border-top:1px solid var(--rule);font-size:12px;color:var(--graphite)}
  .msg{padding:70px 0;color:var(--graphite)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">129 — Rapport de campagne</div>
    <h1 id="title">Chargement…</h1>
    <div class="period" id="period"></div>
  </header>
  <main id="main"></main>
  <footer id="foot"></footer>
</div>
<script>
const q = new URLSearchParams(location.search);
const nf = (n,d=0)=>Number(n||0).toLocaleString('fr-FR',{minimumFractionDigits:d,maximumFractionDigits:d});
const esc = s => String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const httpsOnly = u => /^https:\/\//i.test(String(u || '')) ? String(u) : '';
let CUR='EUR';
const money = n => nf(n, Math.abs(n)<100?2:0) + ' ' + (CUR==='USD'?'$':'€');

(async function(){
  const main = document.getElementById('main');
  try{
    const r = await fetch('/api/report?' + q.toString());
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Rapport indisponible.');
    CUR = d.currency;
    document.getElementById('title').textContent = d.title || 'Rapport de campagne';

    const first = d.campaigns[0];
    const last = first?.daily?.at(-1)?.date;
    document.getElementById('period').textContent =
      first?.start_time ? `Du ${first.start_time.split('T')[0]} au ${last || '—'}` : '';

    main.innerHTML = d.campaigns.map(c => {
      const t = c.totals || {};
      const cpr = t.result_count ? t.spend / t.result_count : null;
      return `
      <section>
        ${d.campaigns.length > 1 ? `<h2>${esc(c.name)}</h2>` : ''}
        <div class="kv">
          <div><div class="k">Personnes touchées</div><div class="v mono">${nf(t.reach)}</div></div>
          <div><div class="k">Impressions</div><div class="v mono">${nf(t.impressions)}</div></div>
          <div><div class="k">${esc(t.result_type || 'Résultats')}</div><div class="v mono">${nf(t.result_count)}</div></div>
          <div><div class="k">Coût par résultat</div><div class="v mono">${cpr == null ? '—' : money(cpr)}</div></div>
        </div>

        ${c.best_ads.length ? `
        <p class="lbl">Ce qui a le mieux fonctionné</p>
        <div class="creas">${c.best_ads.map(a => `
          <div class="crea">
            <img src="${esc(httpsOnly(a.thumbnail))}" alt="">
            <div class="t">${esc(a.name)}</div>
            <div class="n mono">${nf(a.result_count)} ${esc(a.result_type || '')}</div>
            ${httpsOnly(a.preview) ? `<a href="${esc(httpsOnly(a.preview))}" target="_blank" rel="noopener">Voir</a>` : ''}
          </div>`).join('')}</div>` : ''}

        ${c.countries.length ? `
        <p class="lbl">Répartition par pays</p>
        <table><thead><tr><th>Pays</th><th>Impressions</th><th>Résultats</th></tr></thead>
        <tbody>${c.countries.slice(0,10).map(x => `
          <tr><td>${esc(x.country)}</td><td class="mono">${nf(x.impressions)}</td>
              <td class="mono">${nf(x.result_count)}</td></tr>`).join('')}</tbody></table>` : ''}
      </section>`;
    }).join('');

    document.getElementById('foot').textContent =
      'Rapport généré le ' + new Date(d.generated_at).toLocaleDateString('fr-FR') + ' — 129';
  }catch(e){
    main.innerHTML = `<p class="msg">${esc(e.message)}</p>`;
    document.getElementById('title').textContent = 'Rapport indisponible';
  }
})();
</script>
</body>
</html>
